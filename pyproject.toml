[project]
name = "margin-kg-mvp"
version = "0.1.0"
description = "Domain-agnostic knowledge-graph platform: core ontology + pluggable ingestion contract"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph", "ingestion", "resolver", "packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
