# Local Neo4j for the knowledge graph. The foundation itself runs and is fully
# tested WITHOUT this (the in-memory graph store backs the tests); this is only
# for exercising the real Neo4jGraphStore locally.
#
#   docker compose up -d
#   Browser: http://localhost:7474  (user: neo4j, password: password)
#   Bolt:    bolt://localhost:7687
services:
  neo4j:
    # Enterprise edition: the core schema requires a NODE KEY constraint on
    # (Column.system, Column.table, Column.name), and NODE KEY is an Enterprise
    # feature. The developer license covers local/eval use, which is why the
    # license agreement is accepted below.
    image: neo4j:5.22-enterprise
    container_name: mkg-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - mkg_neo4j_data:/data
    healthcheck:
      # Query the default database so "healthy" means it is actually allocated
      # and serving, not merely that the process is up.
      test: ["CMD", "cypher-shell", "-d", "neo4j", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mkg_neo4j_data:
